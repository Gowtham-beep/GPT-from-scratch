[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "A clean implementation of GPT from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "tiktoken",
    "tqdm",
    "matplotlib",
    "requests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
